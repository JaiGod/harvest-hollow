name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html game.js data.js www/

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Harvest Hollow" io.github.jaigod.harvesthollow --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../HarvestHollow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HarvestHollow-apk
          path: HarvestHollow.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Harvest Hollow v1.0.0
          body: |
            Android build of Harvest Hollow (debug-signed). Install HarvestHollow.apk on your phone (allow installs from unknown sources).
            Play in your browser: https://jaigod.github.io/harvest-hollow/
          files: HarvestHollow.apk
          make_latest: true
